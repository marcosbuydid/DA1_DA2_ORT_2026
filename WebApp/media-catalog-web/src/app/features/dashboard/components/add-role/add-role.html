<div class="container">
  <div class="row justify-content-center align-items-center">
    <div class="col-sm-8 col-md-6 col-lg-5 col-xl-4">
      <!-- <div class="card shadow-sm rounded-4 border-0" style="background: #ffffff;"> -->
        <div class="card-body p-5 text-center">
          <h3 class="mb-4 fw-bold text-dark">Add Role</h3>
          @if (submitSuccess) {
            <div class="alert alert-success py-2">Role created successfully!</div>
          }
          <form [formGroup]="addRoleForm" (ngSubmit)="onSubmit()" class="mt-3">
            <div class="mb-4">
              <input type="text"
                     class="form-control rounded-3 border-secondary"
                     placeholder="Type the role name"
                     formControlName="name"
                     [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
              <div *ngIf="submitted && f['name'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['name'].errors['required']">Role name is required</div>
                <div *ngIf="f['name'].errors['pattern']">Only Administrator or User are allowed</div>
              </div>
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary rounded-3 shadow-sm">Save</button>
            </div>
            <div class="d-grid">
              <button type="button" class="btn btn-secondary rounded-3" (click)="onCancel()">Cancel</button>
            </div>
          </form>
        </div>
      <!-- </div> -->
    </div>
  </div>
</div>
