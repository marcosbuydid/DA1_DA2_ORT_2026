<div class="container">
  <div class="row justify-content-center align-items-center">
    <div class="col-sm-8 col-md-6 col-lg-5 col-xl-4">
      <!-- <div class="card shadow-sm rounded-4 border-0" style="background: #ffffff;"> -->
        <div class="card-body p-5 text-center">
          <h3 class="mb-4 fw-bold text-dark">Change Password</h3>

          @if (submitSuccess) {
            <div class="alert alert-success py-2">Password updated successfully!</div>
          }

          <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="mt-3">

            <div class="mb-3">
              <input type="password"
                     class="form-control form-control rounded-3 border-secondary"
                     placeholder="Type your old password"
                     formControlName="oldPassword"
                     [ngClass]="{ 'is-invalid': submitted && f['oldPassword'].errors }" />
              <div *ngIf="submitted && f['oldPassword'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['oldPassword'].errors['required']">Old password is required</div>
              </div>
            </div>

            <div class="mb-3">
              <input type="password"
                     class="form-control form-control rounded-3 border-secondary"
                     placeholder="Type your new password"
                     formControlName="newPassword"
                     [ngClass]="{ 'is-invalid': submitted && f['newPassword'].errors }" />
              <div *ngIf="submitted && f['newPassword'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['newPassword'].errors['required']">New password is required</div>
                <div *ngIf="f['newPassword'].errors['minlength']">Password must have at least 8 characters</div>
              </div>
            </div>

            <div class="mb-4">
              <input type="password"
                     class="form-control form-control rounded-3 border-secondary"
                     placeholder="Retype your new password"
                     formControlName="retypedNewPassword"
                     [ngClass]="{ 'is-invalid': submitted && (f['retypedNewPassword'].errors || changePasswordForm.errors?.['passwordsMismatch']) }" />
              <div *ngIf="submitted && (f['retypedNewPassword'].errors || changePasswordForm.errors?.['passwordsMismatch'])" class="invalid-feedback text-start">
                <div *ngIf="f['retypedNewPassword'].errors?.['required']">Retyped password is required</div>
                <div *ngIf="changePasswordForm.errors?.['passwordsMismatch']">Passwords do not match</div>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary btn rounded-3 shadow-sm">Save</button>
            </div>
            <div class="d-grid">
              <button type="button" class="btn btn-secondary btn rounded-3" (click)="onCancel()">Cancel</button>
            </div>

          </form>
        <!-- </div> -->
      </div>
    </div>
  </div>
</div>
